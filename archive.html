<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理学期刊周报 · 往期存档</title>
<style>
:root {
  --bg: #F5F4ED;
  --text: #2C2C2C;
  --text-secondary: #6b6a64;
  --accent: #1B365D;
  --accent-soft: #EEF2F7;
  --border: #E8E6DC;
}

[data-theme="dark"] {
  --bg: #0d1117;
  --text: #c9d1d9;
  --text-secondary: #8b949e;
  --accent: #58a6ff;
  --accent-soft: #1c2a3a;
  --border: #21262d;
}

* { margin: 0; padding: 0; box-sizing: border-box; }


body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 28px 20px 40px;
}

.container {
  max-width: 600px;
  width: 100%;
}

h1 {
  font-family: 'Charter', 'Noto Serif SC', serif;
  font-size: 28px;
  font-weight: 500;
  color: var(--accent);
  margin-bottom: 8px;
}

.subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 32px;
}

.archive-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.archive-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 6px;
  border: 1px solid var(--border);
  color: var(--text);
  text-decoration: none;
  transition: border-color 0.15s, background 0.15s;
}

.archive-item:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
  text-decoration: none;
}

.archive-week {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 2px 8px;
  border-radius: 4px;
  min-width: 40px;
  text-align: center;
}

.archive-date {
  font-size: 15px;
}

.empty {
  text-align: center;
  padding: 40px;
  color: var(--text-secondary);
}

/* theme toggle */
.theme-bar {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
}

.theme-btn {
  padding: 4px 12px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

.theme-btn.active {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}

.footer {
  margin-top: 40px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-secondary);
  text-align: center;
}
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
  display: none;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border); z-index: 200;
}
.bottomnav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  font-size: 10px; color: var(--text-secondary);
  cursor: pointer; border: none; background: none; font-family: inherit; padding: 4px 0;
}
.bottomnav-item .bn-icon { font-size: 17px; line-height: 1; }
.bottomnav-item:hover { color: var(--text); text-decoration: none; }
.bottomnav-item.active { color: var(--accent); }
.bottomnav-item.active .bn-icon { color: var(--accent); }
@media (max-width: 768px) {
  .bottomnav { display: flex; }
}
</style>
</head>
<body>
<div class="container">
  <h1>心理学期刊周报</h1>
  <p class="subtitle">Psychology Weekly · 往期存档</p>

  <div class="theme-bar">
    <button class="theme-btn active" data-theme="auto">自动</button>
    <button class="theme-btn" data-theme="light">浅色</button>
    <button class="theme-btn" data-theme="dark">深色</button>
  </div>

  <div class="archive-list">
    <a class="archive-item" href="psych_weekly_2026-08-03_2026-08-10.html"><span class="archive-week">W33</span><span class="archive-date">2026/08/03 — 2026/08/10</span></a>
    <a class="archive-item" href="psych_weekly_2026-07-27_2026-08-03.html"><span class="archive-week">W32</span><span class="archive-date">2026/07/27 — 2026/08/03</span></a>
    <a class="archive-item" href="psych_weekly_2026-07-26_2026-08-02.html"><span class="archive-week">W31</span><span class="archive-date">2026/07/26 — 2026/08/02</span></a>
    <a class="archive-item" href="psych_weekly_2026-07-23_2026-07-30.html"><span class="archive-week">W31</span><span class="archive-date">2026/07/23 — 2026/07/30</span></a>
  </div>

  <footer class="footer">
    监控 124 本心理学期刊 · IF ≥ 2.5 · 每周一更新<br>
    <a href="daily/index.html">📰 日报存档</a>
  </footer>
</div>

<script>
(function() {
  try {
    var saved = localStorage.getItem('psych-weekly-theme');
    var mode = (saved === 'dark' || saved === 'light' || saved === 'auto') ? saved : 'auto';
    var actual = mode;
    if (mode === 'auto') {
      actual = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', actual);
  } catch(e) {}
})();

document.querySelectorAll('.theme-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var mode = this.dataset.theme;
    var actual = mode;
    if (mode === 'auto') {
      actual = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', actual);
    localStorage.setItem('psych-weekly-theme', mode);
    document.querySelectorAll('.theme-btn').forEach(function(b) { b.classList.remove('active'); });
    this.classList.add('active');
  });
});
</script>
<script src="favorites.js"></script>
<script src="archive-enhance.js"></script>
<nav class="bottomnav" aria-label="页内导航">

</nav>
</body>
</html>
